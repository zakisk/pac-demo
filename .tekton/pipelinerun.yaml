spec:
  pipelineSpec:
    tasks:
      - name: task
        displayName: "The Task name is Task"
        taskSpec:
          steps:
            - name: task
              image: registry.access.redhat.com/ubi10/ubi-micro
              script: |
                echo "I am good {{ trigger_comment }}"
                sleep 5s
                exit 0
