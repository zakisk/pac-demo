---
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: "bad-plr"
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "pull_request" && stack_target_branch == "main"
spec:
  pipelineSpec:
    tasks:
      - name: task
        displayName: "The Task name is Task"
        taskSpec:
          steps:
            - name: task
              image: registry.access.redhat.com/ubi10/ubi-micro
              script: |
                echo "I am unstoppable and at position {{ stack_position }}"
                exit 0
